  /courier/wallet/fee-config:
    get:
      tags: [Wallet]
      summary: Konfigurasi biaya penarikan
      description: >
        Mengambil konfigurasi biaya (fee) penarikan dana dari konfigurasi server.
        PRD §15: Biaya tidak di-hardcode di client.
      responses:
        '200':
          description: Konfigurasi biaya penarikan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          admin_fee:
                            type: number
                            description: Biaya admin penarikan (IDR, flat)
                            example: 2500
                          minimum:
                            type: number
                            description: Penarikan minimum (IDR)
                            example: 10000
                          maximum:
                            type: number
                            description: Penarikan maksimum (IDR)
                            nullable: true
                            example: 5000000
                          daily_limit:
                            type: number
                            description: Batas penarikan harian (IDR)
                            example: 5000000
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Profil kurir tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /courier/dana/verify:
    post:
      tags: [DANA]
      summary: Verifikasi akun DANA via nomor HP (Account Inquiry)
      description: >
        PRD §8-10: Verifikasi akun DANA menggunakan nomor telepon.
        Untuk saat ini menggunakan mock verification — di production akan memanggil
        DANA Account Inquiry API. Langsung menyimpan koneksi DANA jika berhasil.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number]
              properties:
                phone_number:
                  type: string
                  minLength: 10
                  maxLength: 15
                  example: '081234567890'
      responses:
        '200':
          description: Akun DANA terverifikasi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: connected
                          masked_account:
                            type: string
                            example: 0812**7890
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Profil kurir tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'

  components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Token dari endpoint login/OTP/social auth.

  responses:
    Unauthenticated:
      description: Tidak terautentikasi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Validasi gagal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationEnvelope'
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CredentialsError:
      description: Email atau password salah
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PaymentStatus:
      description: Status pembayaran terkini
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      payment_id:
                        type: string
                      status:
                        type: string
                        enum: [pending, paid, expired, canceled]
                      amount:
                        type: integer
                      payment_type:
                        type: string
                      channel_code:
                        type: string
                        nullable: true
                      va_number:
                        type: string
                        nullable: true
                      expired_at:
                        type: string
                        format: date-time
                        nullable: true
                      paid_at:
                        type: string
                        format: date-time
                        nullable: true

  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          description: Payload respons

    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string

    ValidationEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: object
          description: Peta field → daftar pesan error
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
              - 'The email field is required.'

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        photo_url:
          type: string
          nullable: true
        role:
          type: string
          example: courier

    Courier:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        nik:
          type: string
        phone:
          type: string
        address:
          type: string
        city:
          type: string
        photo:
          type: string
          nullable: true
        vehicle_type:
          type: string
        vehicle_brand:
          type: string
        vehicle_year:
          type: string
        vehicle_plate:
          type: string
        is_verified:
          type: boolean
        is_active:
          type: boolean
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true

    OrderStatus:
      type: string
      enum: [assigned, picking_up, delivering, delivered, cancelled]
      description: |
        Status order:
        * `assigned` — kurir ditugaskan
        * `picking_up` — kurir menuju lokasi pengirim
        * `delivering` — paket dalam perjalanan
        * `delivered` — paket terkirim
        * `cancelled` — dibatalkan

    Order:
      type: object
      properties:
        id:
          type: integer
        order_number:
          type: string
          example: SHP-20260910-ABC123
        tracking_number:
          type: string
          example: CC260910XYZ9
        courier_id:
          type: integer
          nullable: true
        customer_name:
          type: string
        customer_phone:
          type: string
        pickup_address:
          type: string
        pickup_latitude:
          type: number
          nullable: true
        pickup_longitude:
          type: number
          nullable: true
        delivery_address:
          type: string
        delivery_latitude:
          type: number
          nullable: true
        delivery_longitude:
          type: number
          nullable: true
        package_description:
          type: string
          nullable: true
        package_weight:
          type: number
        price:
          type: number
        status:
          $ref: '#/components/schemas/OrderStatus'
        notes:
          type: string
        pickup_photo_url:
          type: string
          nullable: true
        delivery_photo_url:
          type: string
          nullable: true
        picked_up_at:
          type: string
          format: date-time
          nullable: true
        delivering_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        shipment:
          $ref: '#/components/schemas/Shipment'

    OrderPaginator:
      type: object
      description: Paginator Laravel
      properties:
        current_page:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        first_page_url:
          type: string
        last_page:
          type: integer
        last_page_url:
          type: string
        next_page_url:
          type: string
          nullable: true
        prev_page_url:
          type: string
          nullable: true
        path:
          type: string
        per_page:
          type: integer
        total:
          type: integer
        from:
          type: integer
          nullable: true
        to:
          type: integer
          nullable: true

    ShipmentStatus:
      type: string
      enum: [pending, confirmed, assigned, picking_up, picked_up, delivering, delivered, cancelled]
      description: |
        Siklus hidup shipment:
        `pending` → `confirmed` → `assigned` → `picking_up` → `picked_up` →
        `delivering` → `delivered` (atau `cancelled` kapan saja sebelum delivered).

