  # ═══════════════════════════ SYSTEM ═══════════════════════════
  /upload-apk:
    post:
      tags: [System]
      summary: Upload APK (auto-sync dari Flutter)
      description: Diproteksi header `X-Secret-Key`. Maks 200MB.
      security: []
      parameters:
        - name: X-Secret-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [apk_file]
              properties:
                apk_file:
                  type: string
                  format: binary
                  description: File APK (maks 200MB)
                version:
                  type: string
                  description: Default tanggal hari ini (Y.m.d)
                release_notes:
                  type: string
      responses:
        '200':
          description: APK terupload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                          version:
                            type: string
                          size:
                            type: string
                            example: 45.3 MB
                          download_url:
                            type: string
                            format: uri
        '401':
          description: Secret key salah
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
