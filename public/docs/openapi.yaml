      type: object
      properties:
        withdrawal_id:
          type: integer
        idempotency_key:
          type: string
        amount:
          type: number
        fee:
          type: number
        net_amount:
          type: number
        status:
          type: string
          enum: [pending, approved, reserved, processing, completed, rejected, cancelled]
          description: |
            Siklus hidup penarikan (PRD §60):
            `pending` → `approved`/`reserved` → `processing` → `completed`,
            atau `rejected`/`cancelled`.
        destination:
          type: string
          example: DANA
        masked_account:
          type: string
          nullable: true
        provider_reference:
          type: string
          nullable: true
        failure_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        processed_at:
          type: string
          format: date-time
          nullable: true
